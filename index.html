<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rodrisa Ray - AI Image Generator</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Styles -->
  <style>
    :root {
      --bg-color-light: #f0f0f0;
      --bg-color-dark: #121212;
      --text-color-light: #121212;
      --text-color-dark: #f0f0f0;
      --button-bg-light: #007bff;
      --button-bg-dark: #1e90ff;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      transition: background 0.3s, color 0.3s;
    }

    body.light {
      background: var(--bg-color-light);
      color: var(--text-color-light);
    }

    body.dark {
      background: var(--bg-color-dark);
      color: var(--text-color-dark);
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .btn {
      padding: 15px 30px;
      font-size: 1.1rem;
      color: #fff;
      background-color: var(--button-bg-light);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    body.dark .btn {
      background-color: var(--button-bg-dark);
    }

    .toggle-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* Mobile-first font scaling */
    @media (min-width: 768px) {
      h1 {
        font-size: 3rem;
      }
      .btn {
        font-size: 1.3rem;
      }
    }

    /* Canvas for particles */
    #particles-js {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
  </style>
</head>
<body class="light">

  <!-- Particle background -->
  <div id="particles-js"></div>

  <!-- Content -->
  <div class="container">
    <h1>Rodrisa Ray AI Image Generator</h1>
    <a href="https://www.craiyon.com" target="_blank" rel="noopener noreferrer" class="btn">Open Craiyon</a>
  </div>

  <!-- Dark/Light Mode Toggle -->
  <button class="toggle-btn" onclick="toggleMode()">Toggle Dark/Light</button>

  <!-- Particles.js library -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    // Dark/Light mode toggle
    function toggleMode() {
      document.body.classList.toggle('dark');
      document.body.classList.toggle('light');
    }

    // Particles.js configuration
    particlesJS('particles-js', {
      particles: {
        number: { value: 80, density: { enable: true, value_area: 800 } },
        color: { value: "#ffffff" },
        shape: { type: "circle" },
        opacity: { value: 0.5, random: true },
        size: { value: 3, random: true },
        line_linked: { enable: true, distance: 150, color: "#ffffff", opacity: 0.4, width: 1 },
        move: { enable: true, speed: 2, direction: "none", random: false, straight: false, bounce: false }
      },
      interactivity: {
        detect_on: "canvas",
        events: {
          onhover: { enable: true, mode: "repulse" },
          onclick: { enable: true, mode: "push" }
        },
        modes: {
          repulse: { distance: 100 },
          push: { particles_nb: 4 }
        }
      },
      retina_detect: true
    });
  </script>

</body>
</html>
